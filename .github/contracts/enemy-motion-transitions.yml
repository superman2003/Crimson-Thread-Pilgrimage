name: Authored enemy movement transitions

on:
  pull_request:
    paths:
      - 'godot/assets/sprites/original_creatures/**'
      - 'art_requests/enemy_transitions_v1/**'
      - 'godot/scripts/enemy_actor.gd'
      - 'godot/scripts/enemy_attack_choice.gd'
      - 'godot/scripts/enemy_attack_phases.gd'
      - 'godot/scripts/enemy_audio.gd'
      - 'godot/scripts/enemy_boss_tactics.gd'
      - 'godot/scripts/enemy_effects.gd'
      - 'godot/scripts/enemy_engagement.gd'
      - 'godot/scripts/enemy_presentation.gd'
      - 'godot/scripts/enemy_motion_transitions*.gd'
      - 'godot/scripts/hand_drawn_assets.gd'
      - 'godot/scripts/character_motion_v8_validation.gd'
      - 'tools/enemy_transition_art.py'
      - 'tools/test_enemy_transition_art.py'
      - 'tools/check_enemy_transitions_native.py'
      - 'tools/motion_onion.py'
      - 'tools/test_motion_onion.py'
      - 'tools/audit_motion_scale_consistency.py'
      - 'tools/audit_character_animation_assets.py'
      - 'tools/audit_animation_smoothness.py'
      - 'tools/validate_runtime_asset_dependencies.py'
      - 'tools/run_godot_regressions.py'
      - 'tools/godot_suite_success_markers.json'
      - '.github/contracts/enemy-motion-transitions.yml'

permissions:
  contents: read

concurrency:
  group: enemy-motion-transitions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transitions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Hydrate production assets
        run: git lfs pull --include='godot/assets/**'
      - name: Install Godot and validation dependencies
        run: |
          GH_TOKEN="${{ github.token }}" gh release download 4.6.1-stable -R godotengine/godot -p "Godot_v4.6.1-stable_linux.x86_64.zip" -O "$RUNNER_TEMP/godot.zip" --clobber || curl --fail --location --retry 8 --retry-delay 15 --retry-all-errors --connect-timeout 30 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python3 -m pip install --break-system-packages -r tools/requirements-hero.txt
      - name: Verify selected original drawings and immutable core assets
        run: |
          python3 tools/test_enemy_transition_art.py
          python3 tools/test_motion_onion.py
          python3 tools/enemy_transition_art.py audit --kind moss_larva
          python3 tools/audit_motion_scale_consistency.py --report "$RUNNER_TEMP/transition-scale.json"
          python3 tools/validate_runtime_asset_dependencies.py --output "$RUNNER_TEMP/transition-dependencies.json"
      - name: Import production resources
        run: |
          python3 tools/run_godot_import.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --recovery-mode --timeout 600 --log-dir "$RUNNER_TEMP/transition-logs/import"
      - name: Verify real playback, interruptions and frozen combat clocks
        run: |
          python3 tools/run_godot_regressions.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --software-gl --suite enemy_motion_transitions --suite character_motion_v8 --suite enemy_ai_behavior --suite enemy_hit_feedback --suite enemy_combat_continuity --log-dir "$RUNNER_TEMP/transition-logs/runtime"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enemy-motion-transition-logs
          path: |
            ${{ runner.temp }}/transition-logs
            ${{ runner.temp }}/transition-scale.json
            ${{ runner.temp }}/transition-dependencies.json
