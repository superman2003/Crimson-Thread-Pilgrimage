name: Spatial environmental accents

on:
  pull_request:
    paths:
      - '.github/contracts/spatial-ambience.yml'
      - 'godot/scripts/room_ambience*.gd'
      - 'godot/scripts/ambient_soundscape.gd'
      - 'godot/scripts/spatial_ambience*.gd'
      - 'godot/scripts/audio_director.gd'
      - 'godot/scripts/audio_ambience.gd'
      - 'godot/scripts/audio_music.gd'
      - 'godot/scripts/audio_npc_voices.gd'
      - 'godot/scripts/audio_user_mix.gd'
      - 'godot/scripts/spatial_enemy_alert.gd'
      - 'godot/scripts/enemy_sound_filter.gd'
      - 'godot/scripts/main_level.gd'
      - 'godot/scripts/level_activation.gd'
      - 'godot/scripts/level_boss.gd'
      - 'godot/scripts/level_build.gd'
      - 'godot/scripts/level_catalogue.gd'
      - 'godot/scripts/level_demo_state.gd'
      - 'godot/scripts/level_dialogue.gd'
      - 'godot/scripts/level_encounters.gd'
      - 'godot/scripts/level_ground.gd'
      - 'godot/scripts/level_hud.gd'
      - 'godot/scripts/level_hud_build.gd'
      - 'godot/scripts/level_interaction.gd'
      - 'godot/scripts/level_journey_data.gd'
      - 'godot/scripts/level_pickups.gd'
      - 'godot/scripts/level_player_frame.gd'
      - 'godot/scripts/level_region_build.gd'
      - 'godot/scripts/level_region_pipeline.gd'
      - 'godot/scripts/level_residents.gd'
      - 'godot/scripts/level_rooms.gd'
      - 'godot/scripts/level_route_state.gd'
      - 'godot/scripts/level_save_slots.gd'
      - 'godot/scripts/level_world_start.gd'
      - 'godot/scripts/level_world_travel.gd'
      - 'godot/scripts/ending_gates.gd'
      - 'godot/scripts/enemy_placement.gd'
      - 'godot/scripts/level_audio.gd'
      - 'godot/scripts/level_overlays.gd'
      - 'godot/scripts/level_props.gd'
      - 'godot/scripts/level_scenery.gd'
      - 'godot/scripts/map_overlay.gd'
      - 'godot/scripts/optional_challenges.gd'
      - 'godot/scripts/wish_topics.gd'
      - 'godot/data/demo_ch*.json'
      - 'godot/default_bus_layout.tres'
      - 'tools/run_godot_regressions.py'
      - 'tools/godot_suite_success_markers.json'
      - 'tools/run_reliability_98fd8e2f_r10.py'
      - 'tools/run_audio_volume_save_contract.py'
      - 'tools/run_room_reverb_contract.py'
permissions:
  contents: read
concurrency:
  group: spatial-ambience-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head and hydrate runtime assets
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          python3 tools/hydrate_runtime_assets.py
      - name: Install Godot and software GL
        run: |
          GH_TOKEN="${{ github.token }}" gh release download 4.6.1-stable -R godotengine/godot -p "Godot_v4.6.1-stable_linux.x86_64.zip" -O "$RUNNER_TEMP/godot.zip" --clobber || curl --fail --location --retry 8 --retry-delay 15 --retry-all-errors --connect-timeout 30 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Import production resources
        run: |
          python3 tools/run_godot_import.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" \
            --recovery-mode --timeout 600 --log-dir "$RUNNER_TEMP/ambience-logs/import"
      - name: Exercise actual playback, terrain and World publication
        run: |
          python3 tools/run_godot_regressions.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" \
            --software-gl --suite room_ambience --suite room_ambience_world \
            --suite spatial_ambience --suite spatial_ambience_world \
            --suite audio_landmarks --suite audio_retirement --suite world_prepare_budget \
            --log-dir "$RUNNER_TEMP/ambience-logs/gl"
          python3 tools/run_godot_regressions.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" \
            --suite room_ambience --suite room_ambience_world --suite spatial_ambience --log-dir "$RUNNER_TEMP/ambience-logs/dummy"
      - name: Validate isolated director dependency copies
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_reliability_98fd8e2f_r10.py --engine "$engine" --log-dir "$RUNNER_TEMP/ambience-logs/r10"
          python3 tools/run_audio_volume_save_contract.py --engine "$engine" --log-dir "$RUNNER_TEMP/ambience-logs/volume"
          python3 tools/run_room_reverb_contract.py --engine "$engine" --log-dir "$RUNNER_TEMP/ambience-logs/reverb"
      - name: Reject engine errors and unexpected warnings
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          logs = Path(os.environ['RUNNER_TEMP']) / 'ambience-logs'
          for path in [logs/'gl/room_ambience.log', logs/'gl/room_ambience_world.log', logs/'dummy/room_ambience.log', logs/'dummy/room_ambience_world.log', logs/'gl/spatial_ambience.log', logs/'gl/spatial_ambience_world.log', logs/'dummy/spatial_ambience.log']:
              text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', path.read_text())
              assert not re.search(r'^\s*(?:ERROR:|SCRIPT ERROR:)', text, re.M), path
              warnings = re.findall(r'^\s*WARNING:.*$', text, re.M)
              # Xvfb has no swap-interval extension; retain this exact capability
              # message in the logs. Every other warning still fails the gate.
              expected = 'WARNING: Could not set V-Sync mode, as changing V-Sync mode is not supported by the graphics driver.'
              assert all(line.strip() == expected for line in warnings), (path, warnings)
          PY
      - name: Preserve all diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-ambience-logs
          path: ${{ runner.temp }}/ambience-logs
          if-no-files-found: error
