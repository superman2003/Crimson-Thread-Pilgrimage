name: Launch title card
on:
  pull_request:
    paths:
      - 'godot/scripts/title_card*.gd'
      - 'godot/scripts/achievements.gd'
      - 'godot/scripts/main_level.gd'
      - 'tools/run_title_card_contract.py'
      - '.github/contracts/title-card.yml'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: title-card-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            /godot/scripts/ui_type_scale.gd
            /godot/scripts/title_card.gd
            /godot/scripts/boss_rush.gd
            /godot/scripts/audio_retirement.gd
            /godot/scripts/achievements.gd
            /godot/scripts/journey_progress.gd
            /godot/scripts/permanent_ability_roles.gd
            /godot/scripts/journey_desk_store.gd
            /godot/scripts/title_card_validation.gd
            /tools/run_title_card_contract.py
          sparse-checkout-cone-mode: false
      - name: Install Godot 4.6.1
        run: |
          GH_TOKEN="${{ github.token }}" gh release download 4.6.1-stable -R godotengine/godot -p "Godot_v4.6.1-stable_linux.x86_64.zip" -O "$RUNNER_TEMP/godot.zip" --clobber || curl --fail --location --retry 8 --retry-delay 15 --retry-all-errors --connect-timeout 30 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Native title choices, hold and release
        run: python3 tools/run_title_card_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/title-logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: title-card-logs
          path: ${{ runner.temp }}/title-logs
