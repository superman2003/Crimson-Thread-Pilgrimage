name: Background resource ownership

on:
  pull_request:
    paths:
      - 'godot/scripts/main_level.gd'
      - 'godot/scripts/ending_gates.gd'
      - 'godot/scripts/enemy_placement.gd'
      - 'godot/scripts/level_audio.gd'
      - 'godot/scripts/level_overlays.gd'
      - 'godot/scripts/level_props.gd'
      - 'godot/scripts/level_scenery.gd'
      - 'godot/scripts/map_overlay.gd'
      - 'godot/scripts/optional_challenges.gd'
      - 'godot/scripts/wish_topics.gd'
      - 'godot/scripts/audio_director.gd'
      - 'godot/scripts/audio_ambience.gd'
      - 'godot/scripts/audio_music.gd'
      - 'godot/scripts/audio_npc_voices.gd'
      - 'godot/scripts/audio_user_mix.gd'
      - 'godot/scripts/audio_retirement.gd'
      - 'godot/scripts/audio_construction_validation.gd'
      - 'godot/scripts/background_resource_job.gd'
      - 'godot/scripts/hand_drawn_assets.gd'
      - 'godot/scripts/character_art_warm_job.gd'
      - 'godot/scripts/character_art_prewarm_validation.gd'
      - 'godot/scripts/item_art_prewarm_validation.gd'
      - 'godot/scripts/texture_request_exit_validation.gd'
      - 'godot/scripts/background_texture_contention_validation.gd'
      - 'tools/godot_suite_success_markers.json'
      - 'godot/scripts/player_art_warm_job.gd'
      - 'godot/scripts/player_art_prewarm_validation.gd'
      - 'godot/scripts/world_startup_budget_validation.gd'
      - 'godot/scripts/world_prefetch.gd'
      - 'godot/scripts/world_region_loader.gd'
      - '.github/contracts/background-resource-ownership.yml'

permissions:
  contents: read

concurrency:
  group: background-resource-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owned-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head and hydrate runtime assets
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**'
      - name: Install target Godot and software GL
        run: |
          GH_TOKEN="${{ github.token }}" gh release download 4.6.1-stable -R godotengine/godot -p "Godot_v4.6.1-stable_linux.x86_64.zip" -O "$RUNNER_TEMP/godot.zip" --clobber || curl --fail --location --retry 8 --retry-delay 15 --retry-all-errors --connect-timeout 30 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Strict resource imports
        run: |
          python3 tools/run_godot_import.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" \
            --recovery-mode --timeout 600 --log-dir "$RUNNER_TEMP/background-resource/import"
      - name: Exercise actual resource ownership and production atlas consumers
        run: |
          python3 tools/run_godot_regressions.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" \
            --software-gl --suite character_art_prewarm --suite item_art_prewarm --suite texture_request_exit --suite background_texture_contention --log-dir "$RUNNER_TEMP/background-resource/regressions"
          python3 - <<'PY'
          import os
          from pathlib import Path
          logs = Path(os.environ['RUNNER_TEMP'])/'background-resource/regressions'
          for suite in ['character_art_prewarm', 'item_art_prewarm', 'texture_request_exit', 'background_texture_contention']:
              text = (logs/(suite+'.log')).read_text(encoding='utf-8')
              if any(marker in text for marker in ['ObjectDB instances leaked', 'resources still in use', 'Leaked instance:', 'without its completion']):
                  raise SystemExit(suite+': background resource ownership leaked at teardown')
          PY
      - name: Contend for textures under the headless Dummy renderer
        run: |
          # Exported release boots run headless. Dummy texture RIDs are not
          # thread-safe on 4.6.1, so background jobs must load inline there.
          python3 tools/run_godot_regressions.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" \
            --suite background_texture_contention --suite texture_request_exit --suite item_art_prewarm --log-dir "$RUNNER_TEMP/background-resource/headless"
          grep -q 'threaded=false' "$RUNNER_TEMP/background-resource/headless/background_texture_contention.log"
      - name: Preserve all logs including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: background-resource-ownership
          path: ${{ runner.temp }}/background-resource/
