name: Interaction targeting

on:
  pull_request:
    paths:
      - '.github/contracts/interaction-targeting.yml'
      - 'godot/scripts/main_level.gd'
      - 'godot/scripts/level_activation.gd'
      - 'godot/scripts/level_boss.gd'
      - 'godot/scripts/level_build.gd'
      - 'godot/scripts/level_catalogue.gd'
      - 'godot/scripts/level_demo_state.gd'
      - 'godot/scripts/level_dialogue.gd'
      - 'godot/scripts/level_encounters.gd'
      - 'godot/scripts/level_ground.gd'
      - 'godot/scripts/level_hud.gd'
      - 'godot/scripts/level_hud_build.gd'
      - 'godot/scripts/level_interaction.gd'
      - 'godot/scripts/level_journey_data.gd'
      - 'godot/scripts/level_pickups.gd'
      - 'godot/scripts/level_player_frame.gd'
      - 'godot/scripts/level_region_build.gd'
      - 'godot/scripts/level_region_pipeline.gd'
      - 'godot/scripts/level_residents.gd'
      - 'godot/scripts/level_rooms.gd'
      - 'godot/scripts/level_route_state.gd'
      - 'godot/scripts/level_save_slots.gd'
      - 'godot/scripts/level_world_start.gd'
      - 'godot/scripts/level_world_travel.gd'
      - 'godot/scripts/ending_gates.gd'
      - 'godot/scripts/enemy_placement.gd'
      - 'godot/scripts/level_audio.gd'
      - 'godot/scripts/level_overlays.gd'
      - 'godot/scripts/level_props.gd'
      - 'godot/scripts/level_scenery.gd'
      - 'godot/scripts/map_overlay.gd'
      - 'godot/scripts/optional_challenges.gd'
      - 'godot/scripts/wish_topics.gd'
      - 'godot/scripts/world_wayfinding.gd'
      - 'godot/scripts/world_wayfinding_validation.gd'
      - 'godot/scripts/interaction_targeting_validation.gd'
      - 'docs/INTERACTION_TARGETING_UPGRADE.md'

permissions:
  contents: read

concurrency:
  group: interaction-targeting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR head and hydrate runtime assets
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**'
      - name: Install Godot and software GL support
        run: |
          GH_TOKEN="${{ github.token }}" gh release download 4.6.1-stable -R godotengine/godot -p "Godot_v4.6.1-stable_linux.x86_64.zip" -O "$RUNNER_TEMP/godot.zip" --clobber || curl --fail --location --retry 8 --retry-delay 15 --retry-all-errors --connect-timeout 30 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Validate JavaScript and campaign structure
        run: |
          npm test
          npm run test:campaign
      - name: Import resources with strict error checks
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_import.py --engine "$engine" --recovery-mode \
            --timeout 600 --log-dir "$RUNNER_TEMP/interaction-targeting-logs/import"
      - name: Validate selection, proximity prompts, interactions and routes
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_regressions.py --engine "$engine" --software-gl \
            --suite world_wayfinding --suite world_interaction_safety \
            --suite world_route_access --suite obsidian_experience \
            --log-dir "$RUNNER_TEMP/interaction-targeting-logs"
      - name: Preserve regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-targeting-logs
          path: ${{ runner.temp }}/interaction-targeting-logs
          if-no-files-found: ignore
