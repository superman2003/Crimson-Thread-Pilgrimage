name: Display settings (fullscreen, vsync, frame cap)
on:
  pull_request:
    paths:
      - 'godot/scripts/display_*.gd'
      - 'godot/scripts/journey_desk_store.gd'
      - 'godot/scripts/pilgrimage_interface.gd'
      - 'tools/run_display_settings_contract.py'
      - '.github/contracts/display-settings.yml'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: display-settings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-display:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            /godot/scripts/ui_type_scale.gd
            /godot/scripts/display_preferences.gd
            /godot/scripts/display_dialog.gd
            /godot/scripts/settings_dialog_layout.gd
            /godot/scripts/journey_window_layout.gd
            /godot/scripts/journey_desk_store.gd
            /godot/scripts/display_settings_validation.gd
            /tools/run_display_settings_contract.py
          sparse-checkout-cone-mode: false
      - name: Install Godot 4.6.1
        run: |
          GH_TOKEN="${{ github.token }}" gh release download 4.6.1-stable -R godotengine/godot -p "Godot_v4.6.1-stable_linux.x86_64.zip" -O "$RUNNER_TEMP/godot.zip" --clobber || curl --fail --location --retry 8 --retry-delay 15 --retry-all-errors --connect-timeout 30 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Native apply, persistence and dialog contracts
        run: python3 tools/run_display_settings_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/display-logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: display-settings-logs
          path: ${{ runner.temp }}/display-logs
