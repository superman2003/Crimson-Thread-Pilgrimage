name: Stable room camera follow

on:
  pull_request:
    paths:
      - 'godot/scripts/player_controller.gd'
      - 'godot/scripts/camera_focus.gd'
      - 'godot/scripts/room_camera*.gd'
      - 'godot/scripts/camera_focus_validation.gd'
      - 'godot/scripts/first_court_experience_validation.gd'
      - 'godot/scripts/ability_movement_validation.gd'
      - 'godot/scripts/player_state_cleanup_validation.gd'
      - 'tools/run_godot_regressions.py'
      - 'tools/godot_suite_success_markers.json'
      - 'tools/test_regression_runner.py'
      - 'tools/run_godot_import.py'
      - 'tools/software_gl.py'
      - '.github/workflows/room-camera-stability.yml'

permissions:
  contents: read

concurrency:
  group: room-camera-stability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR head and hydrate runtime assets
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**'
      - name: Install Godot and software GL support
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Validate JavaScript and campaign structure
        run: |
          npm test
          npm run test:campaign
      - name: Import resources with strict error checks
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_import.py --engine "$engine" --recovery-mode \
            --timeout 600 --log-dir "$RUNNER_TEMP/room-camera-stability-logs/import"
      - name: Validate real Player framing, room bounds and traversal
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_regressions.py --engine "$engine" --software-gl \
            --suite room_camera_stability --suite camera_focus \
            --suite first_court_experience --suite ability_movement --suite player_state_cleanup \
            --log-dir "$RUNNER_TEMP/room-camera-stability-logs"
      - name: Preserve regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-camera-stability-logs
          path: |
            ${{ runner.temp }}/room-camera-stability-logs
            artifacts/room_camera_stability
          if-no-files-found: ignore
