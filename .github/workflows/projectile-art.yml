name: Authored projectile art

on:
  pull_request:
    paths:
      - '.github/workflows/projectile-art.yml'
      - 'godot/assets/vfx/projectiles/**'
      - 'godot/scripts/projectile_art*.gd'
      - 'godot/scripts/enemy_attack_effect.gd'
      - 'godot/scripts/enemy_effect_lifetime_validation.gd'
      - 'godot/scripts/combat_visual_budget_validation.gd'
      - 'tools/build_projectile_art.py'
      - 'art_requests/attack_effects_v1/incoming/FX_P_*'

permissions:
  contents: read

concurrency:
  group: projectile-art-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head and hydrate runtime and projectile source pixels
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**,art_requests/attack_effects_v1/incoming/FX_P_*.png'
      - name: Validate reproducible runtime pixels against all fifteen delivered sources
        run: |
          python3 -m pip install 'Pillow>=10,<13'
          python3 tools/build_projectile_art.py --check
          npm test
          npm run test:campaign
      - name: Install Godot and software GL
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Import resources with strict diagnostics
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_import.py --engine "$engine" --recovery-mode --timeout 600 --log-dir "$RUNNER_TEMP/projectile-logs/import"
      - name: Validate authored rendering, collision, reflection, retirement and startup budgets
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_regressions.py --engine "$engine" --software-gl \
            --suite enemy_effect_lifetime --suite combat_visual_budget \
            --suite enemy_visibility --suite enemy_lifecycle_regression \
            --suite combat --suite seal_combat --suite player_melee_feedback \
            --suite world_enemy_residency --suite world_startup_budget \
            --suite character_art_prewarm --log-dir "$RUNNER_TEMP/projectile-logs"
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projectile-art-logs
          path: ${{ runner.temp }}/projectile-logs
          if-no-files-found: ignore
