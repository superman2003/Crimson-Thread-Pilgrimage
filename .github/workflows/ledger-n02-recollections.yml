name: N02 committed NPC recollections
on:
  pull_request:
    paths:
      - 'godot/scripts/pilgrimage_interface.gd'
      - 'godot/scripts/main_level.gd'
      - 'godot/scripts/npc_recollections*.gd'
      - 'godot/scripts/protagonist_response*.gd'
      - 'godot/scripts/protagonist_voice.gd'
      - 'godot/scripts/world_narrative.gd'
      - 'godot/data/world_narrative.json'
      - 'godot/data/demo_ch*.json'
      - 'godot/scenes/Player.tscn'
      - 'godot/scripts/journal_reading.gd'
      - 'godot/scripts/dialogue_reading_memory.gd'
      - 'godot/assets/fonts/**'
      - 'godot/assets/ui/inscription/v2/**'
      - 'godot/assets/ui/seals/**'
      - 'tools/run_npc_recollections_contract.py'
      - '.github/workflows/ledger-n02-recollections.yml'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: n02-recollections-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-recollections:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Hydrate actual reading UI dependencies
        run: |
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/fonts/**,godot/assets/ui/inscription/v2/**,godot/assets/ui/seals/**,godot/assets/vfx/**'
      - name: Install pinned Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Validate completed and durable NPC records, known-only journal and reading lifecycle
        run: python3 tools/run_npc_recollections_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/npc-recollection-logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n02-npc-recollections
          path: ${{ runner.temp }}/npc-recollection-logs
