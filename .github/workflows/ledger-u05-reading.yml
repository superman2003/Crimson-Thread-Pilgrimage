name: U05 World reading session
on:
  pull_request:
    paths:
      - 'godot/scripts/pilgrimage_interface.gd'
      - 'godot/scripts/world_reading_session*.gd'
      - 'godot/scripts/journal_reading.gd'
      - 'godot/scripts/dialogue_reading_memory.gd'
      - 'godot/assets/fonts/**'
      - 'godot/assets/ui/inscription/v2/**'
      - 'godot/assets/ui/seals/**'
      - 'tools/run_world_reading_session_contract.py'
      - '.github/workflows/ledger-u05-reading.yml'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: u05-reading-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-reading-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Hydrate actual reading UI dependencies
        run: |
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/fonts/**,godot/assets/ui/inscription/v2/**,godot/assets/ui/seals/**,godot/assets/vfx/**'
      - name: Install pinned Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Validate real UI teardown, slots and deferred restore generations
        run: python3 tools/run_world_reading_session_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/reading-session-logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u05-world-reading-session
          path: ${{ runner.temp }}/reading-session-logs
