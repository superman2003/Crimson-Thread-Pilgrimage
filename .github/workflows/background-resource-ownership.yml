name: Background resource ownership

on:
  pull_request:
    paths:
      - 'godot/scripts/background_resource_job.gd'
      - 'godot/scripts/hand_drawn_assets.gd'
      - 'godot/scripts/character_art_warm_job.gd'
      - 'godot/scripts/character_art_prewarm_validation.gd'
      - 'godot/scripts/texture_request_exit_validation.gd'
      - 'tools/godot_suite_success_markers.json'
      - 'godot/scripts/world_prefetch.gd'
      - 'godot/scripts/world_region_loader.gd'
      - '.github/workflows/background-resource-ownership.yml'

permissions:
  contents: read

concurrency:
  group: background-resource-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owned-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head and hydrate runtime assets
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**'
      - name: Install target Godot and software GL
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Strict resource imports
        run: |
          python3 tools/run_godot_import.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" \
            --recovery-mode --timeout 600 --log-dir "$RUNNER_TEMP/background-resource/import"
      - name: Exercise actual resource ownership and production atlas consumers
        run: |
          python3 tools/run_godot_regressions.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" \
            --software-gl --suite character_art_prewarm --suite texture_request_exit --log-dir "$RUNNER_TEMP/background-resource/regressions"
          python3 - <<'PY'
          import os
          from pathlib import Path
          logs = Path(os.environ['RUNNER_TEMP'])/'background-resource/regressions'
          for suite in ['character_art_prewarm', 'texture_request_exit']:
              text = (logs/(suite+'.log')).read_text(encoding='utf-8')
              if any(marker in text for marker in ['ObjectDB instances leaked', 'resources still in use', 'Leaked instance:', 'without its completion']):
                  raise SystemExit(suite+': background resource ownership leaked at teardown')
          PY
      - name: Preserve all logs including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: background-resource-ownership
          path: ${{ runner.temp }}/background-resource/
