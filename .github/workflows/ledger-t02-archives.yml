name: T02 archived journey browser
on:
  pull_request:
    paths:
      - 'godot/scripts/pilgrimage_interface.gd'
      - 'godot/scripts/main_level.gd'
      - 'godot/scripts/journey_history*.gd'
      - 'godot/scripts/journey_archive*.gd'
      - 'godot/scripts/world_state.gd'
      - 'godot/scripts/world_narrative.gd'
      - 'godot/scripts/journal_reading.gd'
      - 'godot/scripts/dialogue_reading_memory.gd'
      - 'godot/assets/fonts/**'
      - 'godot/assets/ui/inscription/v2/**'
      - 'godot/assets/ui/seals/**'
      - 'tools/run_journey_archive_contract.py'
      - '.github/workflows/ledger-t02-archives.yml'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: t02-archives-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-archive-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Hydrate actual reading UI dependencies
        run: |
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/fonts/**,godot/assets/ui/inscription/v2/**,godot/assets/ui/seals/**,godot/assets/vfx/**'
      - name: Install pinned Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Validate archive identities, pagination and the production history entry
        run: python3 tools/run_journey_archive_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/archive-browser-logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t02-archive-browser
          path: ${{ runner.temp }}/archive-browser-logs
