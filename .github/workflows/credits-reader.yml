name: T05 native release notices
on:
  pull_request:
    paths:
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'godot/**/LICENSE*'
      - 'godot/**/NOTICE*'
      - 'godot/**/OFL*'
      - 'godot/data/credits/**'
      - 'godot/scripts/credits*.gd'
      - 'godot/scripts/pilgrimage_interface.gd'
      - 'tools/*credits*.py'
      - 'tools/build_release.py'
      - '.github/workflows/credits-reader.yml'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: credits-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Byte-exact catalog and generator boundaries
        run: |
          python3 tools/test_credits_catalog.py
          python3 tools/build_credits_catalog.py --check
      - name: Isolated native reader
        run: python3 tools/run_credits_reader_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/credits-isolated"
      - name: Import full resources with existing strict gates
        run: python3 tools/run_godot_import.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --recovery-mode --timeout 600 --log-dir "$RUNNER_TEMP/credits-import"
      - name: Actual World save and settings isolation
        run: python3 tools/run_credits_reader_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --world --log-dir "$RUNNER_TEMP/credits-world"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credits-reader-logs
          path: |
            ${{ runner.temp }}/credits-isolated
            ${{ runner.temp }}/credits-import
            ${{ runner.temp }}/credits-world
