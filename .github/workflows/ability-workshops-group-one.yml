name: Ability workshops group one

on:
  pull_request:
    paths:
      - 'godot/data/world_routes.json'
      - 'tools/build_world_upgrade.py'
      - 'tools/validate_world_upgrade.py'
      - 'tools/workshop_layout_contract.py'
      - 'tools/test_workshop_layout_contract.py'
      - 'godot/scripts/world_upgrade_validation.gd'
      - 'godot/scripts/ability_workshop_route_validation.gd'
      - 'docs/ABILITY_WORKSHOPS_GROUP_ONE.md'
      - '.github/workflows/ability-workshops-group-one.yml'

permissions:
  contents: read

concurrency:
  group: ability-workshops-group-one-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR head and hydrate runtime assets
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**'
      - name: Install Godot and software GL support
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Validate JavaScript and campaign structure
        run: |
          npm test
          npm run test:campaign
          python3 tools/test_workshop_layout_contract.py
          python3 tools/build_world_upgrade.py
          git diff --exit-code -- godot/data/world_routes.json
          python3 tools/build_world_upgrade.py
          git diff --exit-code -- godot/data/world_routes.json
      - name: Import resources with strict error checks
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_import.py --engine "$engine" --recovery-mode \
            --timeout 600 --log-dir "$RUNNER_TEMP/ability-workshops-group-one-logs/import"
      - name: Validate actual workshop movement, rewards, disk restarts and neighboring regions
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_regressions.py --engine "$engine" --software-gl \
            --suite world_upgrade --suite ability_movement --suite upgrade_integration \
            --suite obsidian_experience --suite ch06_workshop_experience --suite world_route_access \
            --log-dir "$RUNNER_TEMP/ability-workshops-group-one-logs"
      - name: Preserve regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ability-workshops-group-one-logs
          path: |
            ${{ runner.temp }}/ability-workshops-group-one-logs
            artifacts/workshop_group_one
          if-no-files-found: ignore
