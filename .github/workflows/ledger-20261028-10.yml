name: Ledger 20261028 10 resource_browser
on:
  pull_request:
    paths:
      - 'godot/scripts/resource_purpose_dialog.gd'
      - 'godot/scripts/resource_purpose_browser.gd'
      - 'godot/scripts/ledger_20261028_10_validation.gd'
      - 'tools/run_ledger_20261028_10.py'
      - 'godot/data/**'
      - '.github/workflows/ledger-20261028-10.yml'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ledger-20261028-10-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pinned Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Compile production and run native behavior
        run: python3 tools/run_ledger_20261028_10.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/ledger-10"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger-20261028-10-logs
          path: ${{ runner.temp }}/ledger-10
