name: Upgrade G05 05-enemy-notes
on:
  pull_request:
    paths:
      - '.github/workflows/upgrade-g-05-enemy-notes.yml'
      - 'godot/scripts/enemy_journal.gd'
      - 'godot/data/enemy_field_notes.json'
      - 'godot/tests/upgrade_g05_enemy_notes.gd'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upgrade-g05-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: false
      - name: Hydrate runtime assets and install pinned engine
        run: |
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**'
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/engine"
      - name: Import project and run focused checks
        shell: bash
        run: |
          set -euo pipefail
          engine="$RUNNER_TEMP/engine/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_import.py --engine "$engine" --recovery-mode --timeout 600 --log-dir "$RUNNER_TEMP/logs/import"
          timeout 90 "$engine" --headless --path godot --script res://tests/upgrade_g05_enemy_notes.gd 2>&1 | tee "$RUNNER_TEMP/logs/specialized.log"
          ! grep -E '^(SCRIPT ERROR|ERROR|USER ERROR):' "$RUNNER_TEMP/logs/specialized.log"
          grep -E '^UPGRADE_G05 checks=[1-9][0-9]* failures=0$' "$RUNNER_TEMP/logs/specialized.log"
          python3 tools/run_godot_regressions.py --engine "$engine" --suite journal_desk --log-dir "$RUNNER_TEMP/logs/existing"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-g05-logs
          path: ${{ runner.temp }}/logs
