name: Reliability R02
on:
  pull_request:
    paths:
      - 'godot/scripts/settings_profiles.gd'
      - 'godot/scripts/settings_profile_codec.gd'
      - 'godot/scripts/controller_preferences.gd'
      - 'godot/scripts/input_binding_policy.gd'
      - 'godot/scripts/input_prompt_bindings.gd'
      - 'godot/scripts/journey_desk_store.gd'
      - 'godot/scripts/settings_persistence.gd'
      - 'godot/scripts/preference_file_transaction.gd'
      - 'godot/scripts/reliability_98fd8e2f_r02_validation.gd'
      - 'tools/run_reliability_98fd8e2f_r02.py'
      - '.github/workflows/reliability-98fd8e2f-r02.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pinned Godot
        run: |
          curl --fail -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
      - name: Native production regression
        run: python tools/run_reliability_98fd8e2f_r02.py --engine /tmp/godot-bin/Godot_v4.6.1-stable_linux.x86_64 --log-dir artifacts/reliability_98fd8e2f_r02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability_98fd8e2f_r02
          path: artifacts/reliability_98fd8e2f_r02
