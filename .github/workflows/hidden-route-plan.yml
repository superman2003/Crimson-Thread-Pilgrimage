name: Hidden route plan validation

on:
  pull_request:
    paths:
      - 'godot/data/world_routes.json'
      - 'godot/data/demo_ch01_moss_bell_court.json'
      - 'godot/data/demo_ch02_rain_foundry_canal.json'
      - 'godot/data/demo_ch03_saltwhite_archive.json'
      - 'godot/data/demo_ch04_broken_string_greenhouse.json'
      - 'godot/data/demo_ch05_obsidian_pilgrim_road.json'
      - 'godot/data/demo_ch06_silent_crown_core.json'
      - 'godot/scripts/hidden_route_plan_validation.gd'
      - 'tools/run_godot_regressions.py'
      - 'tools/godot_suite_success_markers.json'
      - '.github/workflows/hidden-route-plan.yml'
  push:
    branches: [main]
    paths:
      - 'godot/data/world_routes.json'
      - 'godot/data/demo_ch01_moss_bell_court.json'
      - 'godot/data/demo_ch02_rain_foundry_canal.json'
      - 'godot/data/demo_ch03_saltwhite_archive.json'
      - 'godot/data/demo_ch04_broken_string_greenhouse.json'
      - 'godot/data/demo_ch05_obsidian_pilgrim_road.json'
      - 'godot/data/demo_ch06_silent_crown_core.json'
      - 'godot/scripts/hidden_route_plan_validation.gd'
      - 'tools/run_godot_regressions.py'
      - 'tools/godot_suite_success_markers.json'
      - '.github/workflows/hidden-route-plan.yml'

permissions:
  contents: read

concurrency:
  group: hidden-route-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact commit and hydrate runtime assets
        env:
          VALIDATION_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**'
      - name: Install Godot 4.6.1 and software rendering support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Validate chapter data and import runtime resources
        run: |
          npm run test:campaign
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_import.py --engine "$engine" --recovery-mode --timeout 600 --log-dir "$RUNNER_TEMP/hidden-route-plan-logs/import"
      - name: Validate hidden route clues, exits and optional rewards
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_regressions.py \
            --engine "$engine" \
            --suite hidden_route_plan \
            --log-dir "$RUNNER_TEMP/hidden-route-plan-logs/runtime" \
            --timeout 120
      - name: Preserve hidden route plan logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-route-plan-logs
          path: ${{ runner.temp }}/hidden-route-plan-logs
          if-no-files-found: ignore
