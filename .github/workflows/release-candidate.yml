name: Desktop release candidates

on:
  workflow_dispatch:
  pull_request:
    # Each current stacked upgrade base needs the same packaged Windows/Linux gates.
    branches: [main, 'codex/upgrade-20261025-*', 'codex/upgrade-20261025b-*', 'codex/u06-remap-lifecycle', 'codex/e05-loadout-management', 'codex/u04-map-height-context', 'codex/u04-pin-view-navigation', 'codex/u05-journal-reading', 'codex/t01-field-guide', 'codex/n03-earned-voice', 'codex/t03-editor-cold-start', 'codex/w00-*-modern-integration', 'codex/u04-map-pins-modern-integration', 'codex/death-respawn-presentation', 'codex/t03-runtime-soak']
    paths:
      - '.github/workflows/release-candidate.yml'
      - 'tools/build_release.py'
      - 'tools/test_release_builder.py'
      - 'tools/download_godot_release.py'
      - 'tools/test_download_godot_release.py'
      - 'tools/release_save_contract.py'
      - 'tools/test_release_save_contract.py'
      - 'tools/audit_export_contents.py'
      - 'tools/test_export_audit.py'
      - 'tools/release_engine_licenses.gd'
      - 'godot/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/RELEASE_PLAYER_GUIDE.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-candidate.yml'
      - 'tools/build_release.py'
      - 'tools/test_release_builder.py'
      - 'tools/download_godot_release.py'
      - 'tools/test_download_godot_release.py'
      - 'tools/release_save_contract.py'
      - 'tools/test_release_save_contract.py'
      - 'tools/audit_export_contents.py'
      - 'tools/test_export_audit.py'
      - 'tools/release_engine_licenses.gd'
      - 'godot/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/RELEASE_PLAYER_GUIDE.md'

permissions:
  contents: read

concurrency:
  group: desktop-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            editor: Godot_v4.6.1-stable_linux.x86_64
            template: linux_release.x86_64
          - os: windows-2022
            target: windows
            editor: Godot_v4.6.1-stable_win64.exe
            template: windows_release_x86_64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run release gate regression tests
        run: |
          python tools/test_release_builder.py
          python tools/test_download_godot_release.py
          python tools/test_release_save_contract.py
      - name: Audit exported scripts and scenes against runtime references
        run: |
          python tools/test_export_audit.py
          python tools/audit_export_contents.py
      - name: Hydrate project assets, including addon themes
        run: git lfs pull --include='godot/**'
      - name: Install verified Godot editor and matching release template
        env:
          EDITOR_FILE: ${{ matrix.editor }}
          TEMPLATE_FILE: ${{ matrix.template }}
        run: |
          python tools/download_godot_release.py \
            --editor "$EDITOR_FILE" --template "$TEMPLATE_FILE" \
            --root "$RUNNER_TEMP/release-engine"
      - name: Build and boot the actual release on its target OS
        run: python tools/build_release.py --target '${{ matrix.target }}' --output dist/releases
      - name: Upload validated candidate (no public Release is created)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-candidate-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/releases/*.zip
            dist/releases/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Preserve export and player logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-candidate-logs-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/releases/*-logs/
            ${{ runner.temp }}/release-engine/install-receipt.json
          if-no-files-found: ignore
          retention-days: 14
