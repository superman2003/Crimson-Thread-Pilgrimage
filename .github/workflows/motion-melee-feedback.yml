name: Grounded motion and melee feedback

on:
  pull_request:
    paths:
      - 'godot/scripts/player_controller.gd'
      - 'godot/shaders/hit_flash.gdshader'
      - 'godot/scripts/player_layered_idle*.gd'
      - 'godot/scripts/world_death_cache_flush_validation.gd'
      - 'godot/scripts/pilgrimage_interface.gd'
      - 'godot/scripts/player_motion_continuity_validation.gd'
      - 'godot/scripts/player_melee_feedback*.gd'
      - 'godot/scripts/feel_kit.gd'
      - 'godot/scripts/input_settings_regression_validation.gd'
      - 'tools/run_godot_regressions.py'
      - 'tools/godot_suite_success_markers.json'
      - 'tools/run_godot_import.py'
      - 'tools/test_godot_import.py'
      - 'tools/software_gl.py'
      - 'tools/test_regression_runner.py'
      - 'docs/report/20261016_grounded_motion_melee_feedback.md'
      - '.github/workflows/motion-melee-feedback.yml'

permissions:
  contents: read

concurrency:
  group: motion-melee-feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR head and hydrate runtime assets
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**'
      - name: Install Godot and software GL support
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Validate JavaScript and campaign structure
        run: |
          npm test
          npm run test:campaign
      - name: Import resources with strict error checks
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_import.py --engine "$engine" --recovery-mode \
            --timeout 600 --log-dir "$RUNNER_TEMP/motion-melee-feedback-logs/import"
      - name: Validate motion, accepted hits and accessibility settings
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_regressions.py --engine "$engine" --software-gl \
            --suite player_motion_continuity --suite player_melee_feedback --suite hero_animation \
            --suite player_action_buffer --suite player_state_cleanup --suite player_upgrade_regression \
            --suite combat --suite melee_recovery --suite seal_combat \
            --suite input_settings_regression --suite ui_build_accessibility --suite ui_world_integration \
            --suite ui_redesign --suite input_prompt --suite camera_focus --suite ability_movement \
            --suite seal_ui --suite seal_acceptance \
            --suite player_layered_idle --suite world_death_cache_flush \
            --log-dir "$RUNNER_TEMP/motion-melee-feedback-logs"
      - name: Preserve regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-melee-feedback-logs
          path: |
            ${{ runner.temp }}/motion-melee-feedback-logs
            artifacts/motion_melee_feedback
          if-no-files-found: ignore
