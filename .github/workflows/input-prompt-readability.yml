name: Input prompt readability

on:
  pull_request:
    paths:
      - '.github/workflows/input-prompt-readability.yml'
      - 'godot/scripts/input_prompt_bindings.gd'
      - 'godot/scripts/input_prompt_validation.gd'
      - 'godot/scripts/pilgrimage_interface.gd'
      - 'godot/scripts/world_wayfinding.gd'
      - 'tools/run_godot_regressions.py'
      - 'tools/godot_suite_success_markers.json'
      - 'tools/test_regression_runner.py'
      - 'docs/INPUT_PROMPT_READABILITY.md'

permissions:
  contents: read

concurrency:
  group: input-prompts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR head and hydrate runtime assets
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**'
      - name: Install Godot and software GL support
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Validate JavaScript and campaign structure
        run: |
          npm test
          npm run test:campaign
      - name: Import resources with strict error checks
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_import.py --engine "$engine" --recovery-mode \
            --timeout 600 --log-dir "$RUNNER_TEMP/prompt-logs/import"
      - name: Validate device prompts, bindings, UI and world signs
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_regressions.py --engine "$engine" --software-gl \
            --suite input_prompt --suite input_settings_regression \
            --suite ui_build_accessibility --suite world_wayfinding \
            --log-dir "$RUNNER_TEMP/prompt-logs"
      - name: Preserve regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: input-prompt-readability-logs
          path: ${{ runner.temp }}/prompt-logs
          if-no-files-found: ignore
