name: World private checkpoint candidates

on:
  pull_request:
    paths:
      - 'godot/scripts/world_state.gd'
      - 'godot/scripts/world_save_candidate_validation.gd'
      - 'godot/scripts/main_level.gd'
      - 'godot/scripts/world_coordinates.gd'
      - 'godot/scripts/build_system.gd'
      - 'godot/scripts/world_death_cache_flush_validation.gd'
      - 'godot/scripts/build_transaction_runtime_validation.gd'
      - 'tools/run_godot_regressions.py'
      - 'tools/godot_suite_success_markers.json'
      - 'tools/test_regression_runner.py'
      - 'tools/run_godot_import.py'
      - 'tools/software_gl.py'
      - '.github/workflows/world-private-checkpoint.yml'

permissions:
  contents: read

concurrency:
  group: world-private-checkpoint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR head and hydrate runtime assets
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git rev-parse HEAD HEAD^{tree}
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**'
      - name: Install Godot and software GL support
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Validate JavaScript and campaign structure
        run: |
          npm test
          npm run test:campaign
      - name: Import resources with strict error checks
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_import.py --engine "$engine" --recovery-mode \
            --timeout 600 --log-dir "$RUNNER_TEMP/world-private-checkpoint-logs/import"
      - name: Validate candidate ownership and modern save transactions
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_regressions.py --engine "$engine" --software-gl \
            --suite world_save_candidate --suite world_state --suite world_coordinates \
            --suite world_death_cache_flush --suite save_product --suite build_transaction_runtime \
            --log-dir "$RUNNER_TEMP/world-private-checkpoint-logs"
      - name: Preserve regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-private-checkpoint-logs
          path: |
            ${{ runner.temp }}/world-private-checkpoint-logs
            artifacts/modern_private_checkpoint
          if-no-files-found: ignore
