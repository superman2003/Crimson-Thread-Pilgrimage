name: Authored player-skill art

on:
  pull_request:
    paths:
      - '.github/workflows/player-skill-art.yml'
      - 'godot/assets/vfx/player_skills/**'
      - 'godot/scripts/player_skill_art*.gd'
      - 'godot/scripts/player_tool_effect.gd'
      - 'godot/scripts/seal_combat_validation.gd'
      - 'tools/build_player_skill_art.py'
      - 'art_requests/attack_effects_v1/incoming/FX_H_*'

permissions:
  contents: read

concurrency:
  group: player-skill-art-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head and hydrate runtime and player-skill source pixels
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**,art_requests/attack_effects_v1/incoming/FX_H_*.png'
      - name: Validate reproducible runtime pixels against all three delivered sources
        run: |
          python3 -m pip install 'Pillow>=10,<13'
          python3 tools/build_player_skill_art.py --check
          npm test
          npm run test:campaign
      - name: Install Godot and software GL
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Import resources with strict diagnostics
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_import.py --engine "$engine" --recovery-mode --timeout 600 --log-dir "$RUNNER_TEMP/player-skill-logs/import"
      - name: Validate authored rendering, skill hits, control, retirement and startup budgets
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_regressions.py --engine "$engine" --software-gl \
            --suite seal_combat --suite combat_visual_budget \
            --suite seal_system --suite enemy_effect_lifetime \
            --suite combat --suite skill_branches --suite player_melee_feedback \
            --suite world_enemy_residency --suite world_startup_budget \
            --suite character_art_prewarm --suite tool_practice \
            --suite seal_identity --suite player_state_cleanup \
            --suite artisan_crafts --suite seal_acceptance --log-dir "$RUNNER_TEMP/player-skill-logs"
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-skill-art-logs
          path: ${{ runner.temp }}/player-skill-logs
          if-no-files-found: ignore
