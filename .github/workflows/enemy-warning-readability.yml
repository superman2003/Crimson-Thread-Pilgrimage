name: Enemy warning readability

on:
  pull_request:
    branches: [main, codex/ch05-lantern-phase-workshop]
    paths:
      - '.github/workflows/enemy-warning-readability.yml'
      - 'godot/scripts/enemy_actor.gd'
      - 'godot/scripts/enemy_visibility_validation.gd'
      - 'docs/ENEMY_ATTACK_WARNING_READABILITY.md'

permissions:
  contents: read

concurrency:
  group: enemy-warning-readability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact pull request head and hydrate runtime assets
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**'
      - name: Install Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Validate JavaScript and chapter structure
        run: |
          npm test
          npm run test:campaign
      - name: Import Godot resources without editor plugins
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_import.py --engine "$engine" --recovery-mode --log-dir "$RUNNER_TEMP/regression-logs/import"
      - name: Install software GL support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Run focused combat and experience regressions
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          npm run test:godot -- --engine "$engine" --software-gl \
            --suite enemy_visibility \
            --suite obsidian_experience \
            --log-dir "$RUNNER_TEMP/regression-logs"
      - name: Validate registered audio lifetime regression
        if: always() && !cancelled()
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          npm run test:godot -- --engine "$engine" --software-gl \
            --suite audio_retirement \
            --log-dir "$RUNNER_TEMP/regression-logs"
      - name: Preserve focused regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enemy-warning-readability-regressions
          path: ${{ runner.temp }}/regression-logs
          if-no-files-found: ignore
