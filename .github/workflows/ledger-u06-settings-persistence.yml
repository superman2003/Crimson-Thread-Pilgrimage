name: U06 settings persistence and retry
on:
  pull_request:
    paths:
      - 'godot/scripts/pilgrimage_interface.gd'
      - 'godot/scripts/settings_persistence*.gd'
      - 'godot/scripts/controller_preferences.gd'
      - 'godot/scripts/settings_profiles*.gd'
      - 'godot/assets/fonts/**'
      - 'godot/assets/vfx/**'
      - 'godot/assets/ui/**'
      - 'tools/run_settings_persistence_contract.py'
      - 'tools/test_settings_persistence_runner.py'
      - '.github/workflows/ledger-u06-settings-persistence.yml'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: u06-settings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-settings-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Hydrate actual HUD and script dependencies
        run: |
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/fonts/**,godot/assets/vfx/**,godot/assets/ui/**'
      - name: Install pinned Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Verify strict runner rejects failure and misleading output
        run: python3 -m unittest discover -s tools -p test_settings_persistence_runner.py -v
      - name: Validate verified settings writes, pending status and retry
        run: python3 tools/run_settings_persistence_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/settings-persistence-logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u06-settings-layer-contracts
          path: ${{ runner.temp }}/settings-persistence-logs
