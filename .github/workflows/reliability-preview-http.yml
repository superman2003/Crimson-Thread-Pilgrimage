name: Preview HTTP reliability
on:
  pull_request:
    paths: ['server.js', 'tests/preview-http.test.mjs', '.github/workflows/reliability-preview-http.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/preview-http.test.mjs
