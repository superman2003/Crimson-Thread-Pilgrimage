name: E05 saved loadout restore review
on:
  pull_request:
    paths:
      - 'godot/scripts/pilgrimage_interface.gd'
      - 'godot/scripts/main_level.gd'
      - 'godot/scripts/loadout*.gd'
      - 'godot/scripts/build_system.gd'
      - 'godot/scripts/build_profile_comparison.gd'
      - 'godot/scripts/player_controller.gd'
      - 'godot/data/build_catalog.json'
      - 'godot/scenes/Player.tscn'
      - 'godot/scripts/journal_reading.gd'
      - 'godot/scripts/dialogue_reading_memory.gd'
      - 'godot/assets/fonts/**'
      - 'godot/assets/ui/inscription/v2/**'
      - 'godot/assets/ui/seals/**'
      - 'tools/run_loadout_restore_contract.py'
      - '.github/workflows/ledger-e05-restore.yml'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: e05-restore-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-loadout-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Hydrate actual reading UI dependencies
        run: |
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/fonts/**,godot/assets/ui/inscription/v2/**,godot/assets/ui/seals/**,godot/assets/vfx/**'
      - name: Install pinned Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Validate read-only reviews, Main dispatch and preserved resource/timer rules
        run: python3 tools/run_loadout_restore_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/loadout-restore-logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e05-loadout-restore
          path: ${{ runner.temp }}/loadout-restore-logs
