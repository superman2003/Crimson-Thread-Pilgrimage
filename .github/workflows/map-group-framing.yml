name: U04 frame known map groups
on:
  pull_request:
    paths:
      - '.github/workflows/map-group-framing.yml'
      - 'godot/scripts/map_group_framing*.gd'
      - 'godot/scripts/map_directory*.gd'
      - 'godot/scripts/map_floor_labels.gd'
      - 'godot/scripts/survey_map_view.gd'
      - 'godot/scripts/survey_map_knowledge_validation.gd'
      - 'godot/scripts/map_player_pins_runtime.gd'
      - 'godot/scripts/world_atlas.gd'
      - 'tools/run_godot_regressions.py'
      - 'tools/godot_suite_success_markers.json'
permissions:
  contents: read
concurrency:
  group: map-group-framing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head and hydrate assets
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          python3 tools/hydrate_runtime_assets.py
      - name: Install Godot and software GL
        run: |
          curl --fail --location --retry 8 --retry-delay 15 --retry-all-errors --connect-timeout 30 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Import resources
        run: |
          python3 tools/run_godot_import.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" \
            --recovery-mode --timeout 600 --log-dir "$RUNNER_TEMP/map-group-logs/import"
      - name: Validate group framing and existing map behaviour
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_regressions.py --engine "$engine" --software-gl \
            --suite map_group_framing --suite map_directory --suite survey_map_knowledge \
            --suite world_map --suite dialog_dpad_focus --log-dir "$RUNNER_TEMP/map-group-logs/gl"
          python3 tools/run_godot_regressions.py --engine "$engine" --suite map_group_framing \
            --log-dir "$RUNNER_TEMP/map-group-logs/dummy"
          python3 tools/run_map_floor_contract.py --engine "$engine" --log-dir "$RUNNER_TEMP/map-group-logs/floors"
      - name: Reject resource and script diagnostics
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'map-group-logs'
          for path in [root/'gl/map_group_framing.log', root/'dummy/map_group_framing.log', root/'gl/survey_map_knowledge.log']:
              text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', path.read_text())
              assert not re.search(r'^\s*(?:ERROR:|SCRIPT ERROR:)|ObjectDB instances leaked|resources still in use', text, re.M|re.I), path
          PY
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-group-framing-logs
          path: ${{ runner.temp }}/map-group-logs
          if-no-files-found: error
