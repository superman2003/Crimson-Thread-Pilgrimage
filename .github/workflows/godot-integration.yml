name: Godot integration regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Frequent material checkpoints supersede stale runs on the same PR.
concurrency:
  group: godot-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    # Keep the full suite together; individual strict budgets are unchanged.
    timeout-minutes: 45
    steps:
      - name: Check out the exact commit and hydrate runtime assets
        env:
          VALIDATION_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**'
      - name: Install Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Validate JavaScript and chapter structure
        run: |
          python3 tools/test_integration_workflow.py
          npm test
          npm run test:campaign
          python3 -m pip install -r tools/requirements-hero.txt
          python3 tools/test_repack_enemy_attack_frames.py
          python3 tools/validate_hero_v3.py
          python3 tools/test_hero_pose_extraction.py
      - name: Import resources without editor plugins
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          # Resource hydration only: editor-plugin behavior is not validated.
          # Runtime suites below run normally, without recovery mode.
          # A cold checkout imports thousands of assets; retain a bounded 10m budget.
          python3 tools/run_godot_import.py --engine "$engine" --recovery-mode --timeout 600 --log-dir "$RUNNER_TEMP/regression-logs/import"
      - name: Install software GL dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Run chapter, preparation, combat, dialogue and physics regressions
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          npm run test:godot -- --engine "$engine" --software-gl --log-dir "$RUNNER_TEMP/regression-logs"
      - name: Preserve regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-regression-runtime-logs
          path: ${{ runner.temp }}/regression-logs
          if-no-files-found: ignore

  visual:
    runs-on: ubuntu-24.04
    # Pixel probes have an independent job budget instead of consuming the
    # full-suite tail. Every original command and strict marker is retained.
    timeout-minutes: 45
    steps:
      - name: Check out the exact commit and hydrate runtime assets
        env:
          VALIDATION_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**'
      - name: Install Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Import resources without editor plugins
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          # Resource hydration only: editor-plugin behavior is not validated.
          # Runtime suites below run normally, without recovery mode.
          # A cold checkout imports thousands of assets; retain a bounded 10m budget.
          python3 tools/run_godot_import.py --engine "$engine" --recovery-mode --timeout 600 --log-dir "$RUNNER_TEMP/regression-logs/import"
      - name: Validate real GL rock boundaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_rock_gpu_validation.py --engine "$engine" --log-dir "$RUNNER_TEMP/regression-logs/rock-gpu"
          python3 tools/run_rock_gpu_validation.py --engine "$engine" --log-dir "$RUNNER_TEMP/regression-logs/streaming-gpu" --script ../tools/validate_streaming_pixels.gd --success-marker "STREAMING_PIXELS probes=12 failures=0" --summary-path artifacts/world_streaming/gpu_pixels.json
      - name: Validate physical pipe rendering and visible hero
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_rock_gpu_validation.py --engine "$engine" --log-dir "$RUNNER_TEMP/regression-logs/passage-gpu" --script ../tools/validate_passage_pixels.gd --success-marker 'PASSAGE_PIXELS probes=5 failures=0' --summary-path artifacts/world_passage/gpu_pipe.json
      - name: Validate authored rock rims in all regions
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_rock_gpu_validation.py --engine "$engine" --log-dir "$RUNNER_TEMP/regression-logs/room-rims-gpu" --script ../tools/validate_room_rim_pixels.gd --success-marker 'ROOM_RIM_PIXELS probes=12 failures=0' --summary-path artifacts/world_rims/gpu_rims.json
      - name: Validate fixed-coordinate world atlas rendering
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_rock_gpu_validation.py --engine "$engine" --log-dir "$RUNNER_TEMP/regression-logs/atlas-gpu" --script ../tools/validate_world_atlas_pixels.gd --success-marker 'WORLD_ATLAS_PIXELS probes=5 failures=0' --summary-path artifacts/world_atlas/gpu_atlas.json
      - name: Validate neighboring gameplay artwork parity
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_rock_gpu_validation.py --engine "$engine" --log-dir "$RUNNER_TEMP/regression-logs/neighbor-gameplay-gpu" --script ../tools/validate_neighbor_gameplay_pixels.gd --success-marker 'NEIGHBOR_GAMEPLAY_PIXELS probes=6 failures=0' --summary-path artifacts/neighbor_gameplay/gpu_gameplay.json
      - name: Validate live neighboring gameplay and directional pipe approaches
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_rock_gpu_validation.py --engine "$engine" --log-dir "$RUNNER_TEMP/regression-logs/neighbor-gameplay-live-gpu" --script res://scripts/world_neighbor_gameplay_live_validation.gd --success-marker 'WORLD_NEIGHBOR_GAMEPLAY_LIVE checks=48 failures=0' --summary-path artifacts/neighbor_gameplay/gpu_live.json --timeout 300
      - name: Validate budgeted arrival UI against synchronous rendering
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_rock_gpu_validation.py --engine "$engine" --log-dir "$RUNNER_TEMP/regression-logs/region-commit-gpu" --script ../tools/validate_region_commit_pixels.gd --success-marker 'REGION_COMMIT_PIXELS probes=10 failures=0' --summary-path artifacts/region_commit/gpu_ui.json
      - name: Preserve regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-regression-visual-logs
          path: ${{ runner.temp }}/regression-logs
          if-no-files-found: ignore

