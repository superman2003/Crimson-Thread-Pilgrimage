name: U04 authored map floors
on:
  pull_request:
    paths:
      - 'godot/data/demo_ch*.json'
      - 'godot/scripts/map_directory*.gd'
      - 'godot/scripts/map_floor_labels*.gd'
      - 'tools/run_map_floor_contract.py'
      - '.github/workflows/ledger-u04-floors.yml'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: u04-floors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-floor-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Hydrate actual runtime font
        run: |
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/fonts/GlobalTypeface.otf'
      - name: Install pinned Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Validate metadata, knowledge boundaries and native directory
        run: python3 tools/run_map_floor_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/floor-logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u04-floor-contracts
          path: ${{ runner.temp }}/floor-logs
