name: Budgeted neighbor gameplay plans

on:
  pull_request:
    paths:
      - 'godot/scripts/world_gameplay_*.gd'
      - 'godot/scripts/world_prefetch.gd'
      - 'godot/scripts/world_variant_copy_job.gd'
      - 'godot/scripts/world_neighbor_gameplay*validation.gd'
      - 'godot/scripts/world_neighbor_entities_validation.gd'
      - 'godot/scripts/world_config_validator.gd'
      - 'tools/validate_neighbor_gameplay_pixels.gd'
      - 'tools/run_godot_regressions.py'
      - 'tools/godot_suite_success_markers.json'
      - '.github/workflows/world-gameplay-plan.yml'

permissions:
  contents: read

concurrency:
  group: world-gameplay-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head and hydrate runtime assets
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**'
      - name: Install Godot and software GL support
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Validate JavaScript and campaign contracts
        run: |
          npm test
          npm run test:campaign
      - name: Import resources with strict error checks
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_import.py --engine "$engine" --recovery-mode \
            --timeout 600 --log-dir "$RUNNER_TEMP/world-gameplay-plan-logs/import"
      - name: Validate bounded planning, leases and shared ownership
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_godot_regressions.py --engine "$engine" --software-gl \
            --suite world_gameplay_plan --suite world_variant_copy \
            --suite world_neighbor_config --suite world_neighbor_gameplay \
            --suite world_neighbor_gameplay_stress --suite world_neighbor_collision \
            --suite world_neighbor_entities --suite world_streaming \
            --suite world_passage --suite world_async_loading --suite world_host \
            --log-dir "$RUNNER_TEMP/world-gameplay-plan-logs"
      - name: Validate normal-damage live adoption and actual artwork
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          python3 tools/run_rock_gpu_validation.py --engine "$engine" \
            --log-dir "$RUNNER_TEMP/world-gameplay-plan-logs/live" \
            --script res://scripts/world_neighbor_gameplay_live_validation.gd \
            --success-marker 'WORLD_NEIGHBOR_GAMEPLAY_LIVE checks=48 failures=0' \
            --summary-path artifacts/neighbor_gameplay/gpu_live.json --timeout 300
          python3 tools/run_rock_gpu_validation.py --engine "$engine" \
            --log-dir "$RUNNER_TEMP/world-gameplay-plan-logs/artwork" \
            --script ../tools/validate_neighbor_gameplay_pixels.gd \
            --success-marker 'NEIGHBOR_GAMEPLAY_PIXELS probes=6 failures=0' \
            --summary-path artifacts/neighbor_gameplay/gpu_gameplay.json
      - name: Preserve regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-gameplay-plan-logs
          path: |
            ${{ runner.temp }}/world-gameplay-plan-logs
            artifacts/neighbor_gameplay
          if-no-files-found: ignore
