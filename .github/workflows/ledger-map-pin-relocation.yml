name: U04 relocate known player pins
on:
  pull_request:
    paths:
      - 'godot/scripts/atlas_route_cue.gd'
      - 'godot/scripts/background_resource_job.gd'
      - 'godot/scripts/cartography_runtime.gd'
      - 'godot/scripts/hand_drawn_assets.gd'
      - 'godot/scripts/hand_drawn_map_room.gd'
      - 'godot/scripts/map_pin_relocation_validation.gd'
      - 'godot/scripts/map_player_pins.gd'
      - 'godot/scripts/map_player_pins_runtime.gd'
      - 'godot/scripts/map_room_context.gd'
      - 'godot/scripts/map_room_navigation.gd'
      - 'godot/scripts/pilgrimage_cartography.gd'
      - 'godot/scripts/survey_map_knowledge.gd'
      - 'godot/scripts/survey_map_surface.gd'
      - 'godot/scripts/world_atlas.gd'
      - 'godot/scripts/world_collision_geometry.gd'
      - 'godot/scripts/world_coordinates.gd'
      - 'godot/scripts/world_passage.gd'
      - 'godot/scripts/world_platform_body.gd'
      - 'godot/scripts/world_rock_material.gd'
      - 'godot/scripts/world_routes.gd'
      - 'godot/scripts/world_state.gd'
      - 'godot/scripts/world_wayfinding.gd'
      - 'godot/assets/fonts/GlobalTypeface.otf'
      - 'godot/shaders/ink_cave_edge.gdshader'
      - 'godot/shaders/passage_support.gdshader'
      - 'godot/shaders/world_rock.gdshader'
      - 'tools/run_map_pin_relocation_contract.py'
      - '.github/workflows/ledger-map-pin-relocation.yml'
      - 'godot/data/world_*.json'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: map_pin_relocation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pinned Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Native production component contract
        run: python3 tools/run_map_pin_relocation_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/native-contract"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map_pin_relocation-logs
          path: ${{ runner.temp }}/native-contract

