name: U05 confirmed batch reading preferences
on:
  pull_request:
    paths:
      - 'godot/scripts/journal_batch_read.gd'
      - 'godot/scripts/journal_batch_read_validation.gd'
      - 'godot/scripts/journal_catalog.gd'
      - 'godot/scripts/journal_query.gd'
      - 'tools/run_journal_batch_read_contract.py'
      - '.github/workflows/ledger-journal-batch-read.yml'
      - 'godot/scripts/pilgrimage_interface.gd'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: journal_batch_read-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pinned Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Native production component contract
        run: python3 tools/run_journal_batch_read_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/native-contract"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal_batch_read-logs
          path: ${{ runner.temp }}/native-contract

