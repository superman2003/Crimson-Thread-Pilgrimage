name: U05 literal search in a known journal document
on:
  pull_request:
    paths:
      - 'godot/scripts/journal_find*.gd'
      - 'godot/scripts/journal_literal_find.gd'
      - 'godot/scripts/pilgrimage_interface.gd'
      - 'tools/run_journal_find_contract.py'
      - '.github/workflows/journal-find.yml'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: journal-find-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Native Unicode selection and keyboard contracts
        run: python3 tools/run_journal_find_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/find-native"
      - name: Two strict resource imports
        run: python3 tools/run_godot_import.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --recovery-mode --timeout 600 --log-dir "$RUNNER_TEMP/find-import"
      - name: Actual World reader and unchanged state
        run: python3 tools/run_journal_find_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --world --log-dir "$RUNNER_TEMP/find-world"
      - name: Original journal contracts
        run: |
          python3 tools/run_godot_regressions.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --suite journal_desk --suite ui_world_integration --log-dir "$RUNNER_TEMP/find-existing"
          python3 tools/run_world_reading_session_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/find-session"
          python3 tools/run_journal_batch_read_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/find-batch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-find-logs
          path: ${{ runner.temp }}/find-*
