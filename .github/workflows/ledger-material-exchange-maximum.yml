name: G01 canonical maximum material exchange
on:
  pull_request:
    paths:
      - 'godot/scripts/build_system.gd'
      - 'godot/scripts/field_contracts.gd'
      - 'godot/scripts/field_transaction.gd'
      - 'godot/scripts/journey_desk_window.gd'
      - 'godot/scripts/material_exchange.gd'
      - 'godot/scripts/material_exchange_desk.gd'
      - 'godot/scripts/material_exchange_maximum_validation.gd'
      - 'godot/scripts/resupply_budget.gd'
      - 'godot/scripts/world_coordinates.gd'
      - 'godot/scripts/world_state.gd'
      - 'tools/run_material_exchange_maximum_contract.py'
      - '.github/workflows/ledger-material-exchange-maximum.yml'
      - 'godot/data/field_contracts.json'
      - 'godot/data/build_catalog.json'
      - 'godot/data/material_exchange.json'
      - 'godot/data/world_layout.json'
      - 'godot/data/permanent_ability_roles.json'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: material_exchange_maximum-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pinned Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Native production component contract
        run: python3 tools/run_material_exchange_maximum_contract.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" --log-dir "$RUNNER_TEMP/native-contract"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material_exchange_maximum-logs
          path: ${{ runner.temp }}/native-contract

