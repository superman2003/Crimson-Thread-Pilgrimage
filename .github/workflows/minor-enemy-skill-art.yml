name: Ordinary enemy skill material art

on:
  pull_request:
    paths:
      - '.github/workflows/minor-enemy-skill-art.yml'
      - 'godot/assets/vfx/minor_enemy_skills/**'
      - 'godot/scripts/minor_enemy_skill_art*.gd'
      - 'godot/scripts/enemy_actor.gd'
      - 'godot/scripts/enemy_attack_effect.gd'
      - 'godot/scripts/hand_drawn_assets.gd'
      - 'godot/scripts/projectile_art.gd'
      - 'godot/scripts/enemy_visibility_validation.gd'
      - 'godot/scripts/enemy_tactical_roles_validation.gd'
      - 'tools/run_godot_regressions.py'
      - 'tools/godot_suite_success_markers.json'
      - 'tools/build_minor_enemy_skill_art.py'
      - 'tools/capture_minor_enemy_skill_art.gd'
      - 'art_requests/minor_enemy_skills_v4/**'

permissions:
  contents: read

concurrency:
  group: minor-enemy-skill-art-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the PR head and hydrate runtime and selected source art
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$VALIDATION_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --skip-smudge
          git lfs pull --include='godot/assets/**,art_requests/minor_enemy_skills_v4/incoming/*.png,art_requests/creature_attacks_v1/refs/*.png'
      - name: Reproduce the runtime atlas from every selected delivery
        run: |
          python3 -m pip install 'Pillow>=10,<13'
          python3 art_requests/minor_enemy_skills_v4/build_list.py --check
          python3 tools/build_minor_enemy_skill_art.py --inspect --check
          python3 tools/build_minor_enemy_skill_art.py --check
      - name: Install Godot and software GL
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Import resources with strict diagnostics
        run: |
          python3 tools/run_godot_import.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" \
            --recovery-mode --timeout 600 --log-dir "$RUNNER_TEMP/minor-enemy-skill-logs/import"
      - name: Verify every command and existing art, lifetime, collision, budgets and prewarm
        run: |
          python3 tools/run_godot_regressions.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64" \
            --software-gl --suite minor_enemy_skill_art --suite enemy_effect_lifetime \
            --suite enemy_lifecycle_regression --suite combat_visual_budget \
            --suite enemy_tactical_roles --suite enemy_ai_behavior --suite boss_skill_art \
            --suite enemy_visibility --suite combat --suite world_enemy_residency \
            --suite world_startup_budget --suite character_art_prewarm \
            --log-dir "$RUNNER_TEMP/minor-enemy-skill-logs"
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minor-enemy-skill-art-logs
          path: ${{ runner.temp }}/minor-enemy-skill-logs
          if-no-files-found: ignore
